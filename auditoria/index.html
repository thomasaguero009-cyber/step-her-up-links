<title>Auditoría de cuenta | Step Her Up</title>
<meta name="description" content="Hoja de auditoría de cuentas de Instagram para las vendedoras de Step Her Up.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--wine:#3d0f1f;--wine2:#5a1626;--wine3:#1a0509;--blush:#f0a8be;--rose:#e88aa8;--cream:#f7ece9;--paper:#fdf8f5;--ink:#2a0a13;--mut:#7a5a63;--line:#ecdcd6;--ok:#2f7d5b;--mid:#c78a1f;--no:#b3382e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
.wrap{max-width:880px;margin:0 auto;padding:40px 20px 80px}
.eyebrow{font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;font-weight:700;color:var(--rose)}
h1{font-family:'Playfair Display',serif;font-weight:600;font-size:clamp(32px,6vw,46px);line-height:1.08;color:var(--wine);margin-top:8px}
h1 em,h2 em{font-style:italic;color:var(--rose)}
h2{font-family:'Playfair Display',serif;font-weight:600;font-size:28px;color:var(--wine);margin:0}
.lead{color:var(--mut);margin-top:10px;max-width:640px}
.datos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:26px 0 8px}
.datos label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);display:block;margin-bottom:5px}
input[type=text]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit;color:var(--ink)}
input[type=text]:focus{outline:2px solid var(--blush);border-color:var(--rose)}
.sec{margin-top:34px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px}
.sec-sc{font-size:13px;font-weight:700;color:var(--mut)}
.sec p.d{color:var(--mut);font-size:14px;margin-bottom:12px}
.it{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:center}
.it b{font-weight:600;font-size:15.5px;display:block}
.it span.s{font-size:13px;color:var(--mut)}
.op{display:flex;gap:6px}
.op button{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--mut);border-radius:999px;padding:7px 13px;cursor:pointer}
.op button.on.si{background:var(--ok);border-color:var(--ok);color:#fff}
.op button.on.pa{background:var(--mid);border-color:var(--mid);color:#fff}
.op button.on.no{background:var(--no);border-color:var(--no);color:#fff}
.res{margin-top:40px;background:linear-gradient(180deg,var(--wine2),var(--wine3));color:var(--cream);border-radius:24px;padding:30px 28px}
.res h2{color:var(--cream)}
.puntaje{font-family:'Playfair Display',serif;font-size:64px;line-height:1;margin:14px 0 4px}
.puntaje small{font-size:24px;color:var(--blush);font-style:italic}
.niv{color:var(--blush);font-weight:600}
.hall{margin-top:20px}
.hall div.h{background:rgba(255,255,255,.07);border:1px solid rgba(240,168,190,.3);border-radius:14px;padding:12px 16px;margin-top:10px}
.hall b{display:block;font-weight:600}
.hall span{font-size:14px;color:rgba(247,236,233,.8)}
.puente{margin-top:20px;font-size:15px;color:rgba(247,236,233,.9);border-top:1px solid rgba(240,168,190,.3);padding-top:16px}
.acc{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.acc button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:13px 22px;cursor:pointer;background:var(--blush);color:var(--wine)}
.acc button.sec2{background:transparent;color:var(--cream);border:1px solid rgba(240,168,190,.5)}
.vacio{color:rgba(247,236,233,.7);font-size:14px;margin-top:14px}
@media(max-width:640px){.datos{grid-template-columns:1fr}.it{grid-template-columns:1fr}}
@media print{.acc,.op button:not(.on){display:none}body{background:#fff}.res{break-inside:avoid}.it{break-inside:avoid}}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Para las vendedoras</div>
  <h1>Auditoría de <em>cuenta</em></h1>
  <p class="lead">Mira el Instagram de la clienta mientras hablan y marca cada punto. Abajo se arma sola la lista de lo que le falta, para llevarla a la presentación del upsell.</p>

  <div class="datos">
    <div><label for="nom">Nombre de la clienta</label><input type="text" id="nom" placeholder="Nombre"></div>
    <div><label for="ig">Usuario de Instagram</label><input type="text" id="ig" placeholder="@usuario"></div>
  </div>

  <div id="secs"></div>

  <div class="res" id="res">
    <div class="eyebrow">Resultado</div>
    <div class="puntaje" id="pt">0<small>/100</small></div>
    <div class="niv" id="nv"></div>
    <div class="hall" id="hall"></div>
    <div class="puente" id="puente"></div>
    <div class="acc">
      <button id="copiar">Copiar resumen</button>
      <button class="sec2" id="imprimir">Guardar en PDF</button>
      <button class="sec2" id="limpiar">Empezar otra</button>
    </div>
  </div>
</div>
<script>
const SECS=[
 {t:'Tu perfil',d:'Lo primero que ve una clienta cuando llega a la cuenta.',it:[
  ['Foto de perfil','Se ve la cara, con buena luz y buena calidad.','Cambiar la foto por una de tu cara, con buena luz y de cerca.'],
  ['Nombre','Dice qué haces, con la palabra que busca tu clienta.','Poner en el nombre qué haces, con la palabra que tu clienta busca.'],
  ['Bio: a quién ayudas y qué logra','En una frase se entiende a quién ayuda y qué resultado da.','Reescribir la bio con a quién ayudas y qué resultado logra.'],
  ['Bio: una acción clara','Hay un solo llamado a la acción.','Cerrar la bio con una sola acción clara.'],
  ['Link','Lleva a un solo lugar útil, como la agenda o un formulario.','Dejar un solo link que lleve a agendar o a escribirte.'],
  ['Destacadas','Ordenadas, con portada coherente, y cuentan quién es, qué ofrece y pruebas.','Ordenar las destacadas con quién eres, qué ofreces y tus pruebas.'],
  ['Publicaciones fijadas','Las fijadas presentan su autoridad, una prueba y su oferta.','Fijar tres publicaciones: autoridad, prueba y oferta.']]},
 {t:'Tu contenido',d:'Según las 7 reglas de los Frameworks para guionizar: idea masiva, postura, hook, desarrollo y valor.',it:[
  ['Idea masiva','Habla de algo que la gente ya se pregunta, comenta o comparte.','Elegir temas que tu clienta ya se pregunta y que comparte con otras.'],
  ['Postura clara','Dice lo que cree y por qué, no solo explica el tema.','Decir lo que crees con "Yo creo que ___ porque ___".'],
  ['Hook con tensión','Los primeros segundos detienen a la persona y abren una pregunta.','Reescribir el inicio de cada video con un hook con tensión.'],
  ['Desarrollo y valor al final','Cada frase pide la siguiente y el valor llega al final.','Guardar el valor para el final y quitar lo que no suma.'],
  ['Mezcla y frecuencia','Alterna autoridad, conexión, prueba y venta, al menos 3 piezas por semana.','Publicar 3 piezas por semana, alternando autoridad, conexión, prueba y venta.']]},
 {t:'Tu oferta y tu forma de vender',d:'Cómo pasa de que la sigan a que le compren.',it:[
  ['Se entiende qué vende','Queda claro qué vende, a quién y qué resultado da.','Explicar en una frase qué vendes, a quién y qué resultado da.'],
  ['Prueba visible','Hay testimonios o resultados reales a la vista.','Mostrar testimonios y resultados reales en destacadas y publicaciones.'],
  ['Un solo llamado a la acción','Cada pieza de venta pide una sola cosa.','Dejar un solo llamado a la acción por pieza.'],
  ['Camino para escribirle o agendar','La clienta sabe cómo dar el siguiente paso.','Dejar claro el camino: escribir por mensaje o agendar.'],
  ['Seguimiento a mensajes','Responde y da seguimiento a mensajes y comentarios.','Responder y dar seguimiento a cada mensaje y comentario.']]}
];
const V={si:2,pa:1,no:0};
let est={};
const KEY='auditoria-shu';
try{est=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){est={}}
const $=id=>document.getElementById(id);
$('nom').value=est.nom||'';$('ig').value=est.ig||'';
function guardar(){est.nom=$('nom').value;est.ig=$('ig').value;try{localStorage.setItem(KEY,JSON.stringify(est))}catch(e){}}
function pintar(){
  let h='';
  SECS.forEach((s,si)=>{
    h+=`<div class="sec"><div class="sec-h"><h2>${s.t}</h2><span class="sec-sc" id="sc${si}"></span></div><p class="d">${s.d}</p>`;
    s.it.forEach((x,i)=>{const k=si+'-'+i,v=est[k];
      h+=`<div class="it"><div><b>${x[0]}</b><span class="s">${x[1]}</span></div><div class="op">`+
      [['si','Sí'],['pa','Parcial'],['no','No']].map(o=>`<button class="${o[0]}${v===o[0]?' on':''}" data-k="${k}" data-v="${o[0]}">${o[1]}</button>`).join('')+`</div></div>`});
    h+='</div>'});
  $('secs').innerHTML=h;calc();
}
function calc(){
  let tot=0,max=0,falt=[];
  SECS.forEach((s,si)=>{let a=0,m=s.it.length*2;
    s.it.forEach((x,i)=>{const v=est[si+'-'+i];if(v){a+=V[v];if(v!=='si')falt.push({p:V[v],n:x[0],a:x[2],s:s.t})}});
    $('sc'+si).textContent=a+' / '+m;tot+=a;max+=m});
  const pct=Math.round(tot/max*100);
  $('pt').innerHTML=pct+'<small>/100</small>';
  $('nv').textContent=pct>=80?'Cuenta muy bien armada, se puede pulir':pct>=50?'Buena base, con ajustes claros':'Hay mucho por mejorar, y por eso es buen momento para trabajarlo';
  falt.sort((a,b)=>a.p-b.p);
  const top=falt.slice(0,3);
  window._top=top;
  $('hall').innerHTML=top.length?top.map((f,i)=>`<div class="h"><b>${i+1}. ${f.n}</b><span>${f.a}</span></div>`).join(''):'<div class="vacio">Marca los puntos de arriba y aquí aparecen los 3 ajustes principales.</div>';
  $('puente').textContent=top.length?'Para decir en la llamada: "Esto es justo lo que trabajamos en las 3 llamadas con Gianie y en tu estrategia de marca personal."':'';
}
document.addEventListener('click',e=>{const b=e.target.closest('.op button');if(!b)return;const k=b.dataset.k;est[k]=est[k]===b.dataset.v?undefined:b.dataset.v;guardar();pintar()});
['nom','ig'].forEach(i=>$(i).addEventListener('input',guardar));
$('copiar').onclick=async()=>{
  const t=window._top||[];
  const txt='Auditoría de cuenta'+($('nom').value?' - '+$('nom').value:'')+($('ig').value?' ('+$('ig').value+')':'')+'\nPuntaje: '+$('pt').textContent+'\n\nLo principal para ajustar:\n'+t.map((f,i)=>(i+1)+'. '+f.n+': '+f.a).join('\n');
  try{await navigator.clipboard.writeText(txt);$('copiar').textContent='Copiado'}catch(e){window.prompt('Copia el resumen',txt)}
  setTimeout(()=>$('copiar').textContent='Copiar resumen',1800)};
$('imprimir').onclick=()=>window.print();
$('limpiar').onclick=()=>{if(!confirm('¿Empezar una auditoría nueva? Se borra la actual.'))return;est={};guardar();$('nom').value='';$('ig').value='';pintar()};
pintar();
</script>
</body>
</html>
