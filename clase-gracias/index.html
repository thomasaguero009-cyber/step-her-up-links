<style>
  :root{ --wine-1:#1a0509; --wine-2:#3d0f1f; --wine-3:#5a1626; --blush:#f0a8be; --blush-2:#e88aa8; --cream:#f7ece9; --line:rgba(255,255,255,.16); }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{ min-height:100vh; color:var(--cream); font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; line-height:1.55; -webkit-font-smoothing:antialiased;
        background:radial-gradient(900px 600px at 80% -5%, rgba(106,26,48,.65), transparent 60%), radial-gradient(800px 500px at 0% 60%, rgba(90,22,38,.4), transparent 60%), linear-gradient(180deg,var(--wine-2) 0%,var(--wine-1) 55%); background-attachment:fixed; }
  .wrap{ max-width:880px; margin:0 auto; padding:0 20px; }
  header{ padding:26px 0 8px; text-align:center; }
  header img{ height:64px; width:auto; margin:0 auto; }
  .eyebrow{ font-size:12px; letter-spacing:.22em; text-transform:uppercase; font-weight:700; color:var(--blush); margin:26px 0 12px; text-align:center; }
  h1{ margin-top:26px !important; font-family:"Playfair Display",Georgia,serif; font-weight:600; font-size:clamp(34px,6vw,58px); line-height:1.08; margin:0 auto; text-align:center; text-wrap:balance; }
  h1 em{ color:var(--blush); }
  .lede-abajo{ margin-top:26px !important; }
  .lede{ text-align:center; font-size:19px; color:rgba(247,236,233,.82); max-width:600px; margin:16px auto 26px; }
  .btn{ display:flex; align-items:center; justify-content:center; gap:12px; width:100%; max-width:520px; margin:0 auto; padding:20px 28px; border-radius:12px; background:linear-gradient(90deg,var(--blush-2),var(--blush)); color:#2a0a13; font-weight:800; font-size:20px; text-decoration:none; box-shadow:0 14px 34px rgba(232,138,168,.32); transition:transform .15s; }
  .btn:hover{ transform:translateY(-2px); }
  .btn svg{ width:26px; height:26px; flex:0 0 26px; }
  .hint{ text-align:center; font-size:14px; color:rgba(247,236,233,.65); margin:12px 0 0; }
  .video{ margin:30px auto 0; border-radius:16px; overflow:hidden; background:#000; box-shadow:0 30px 70px rgba(0,0,0,.55); border:1px solid var(--line); aspect-ratio:16/9; }
  .video video{ width:100%; height:100%; display:block; background:#000; }
  .video-cap{ text-align:center; font-size:14px; color:rgba(247,236,233,.7); margin:12px 0 0; }
  .steps{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin:44px 0 0; }
  .step{ border-top:2px solid var(--blush-2); padding-top:16px; }
  .step b{ font-family:"Playfair Display",serif; font-size:40px; color:var(--blush); line-height:1; }
  .step h3{ font-family:"Playfair Display",serif; font-weight:600; font-size:21px; margin:8px 0 6px; }
  .step p{ margin:0; font-size:15px; color:rgba(247,236,233,.75); }
  .final{ text-align:center; margin:52px 0 0; padding:40px 24px; border:1px solid var(--line); border-radius:20px; background:rgba(255,255,255,.04); }
  .final h2{ font-family:"Playfair Display",serif; font-weight:600; font-size:clamp(26px,4vw,36px); margin:0 0 8px; text-wrap:balance; }
  .final p{ margin:0 auto 22px; color:rgba(247,236,233,.78); max-width:520px; }
  footer{ text-align:center; padding:40px 0 48px; font-size:13px; color:rgba(247,236,233,.55); }
  @media (max-width:700px){ .steps{ grid-template-columns:1fr; gap:22px; } header img{ height:54px; } .btn{ font-size:18px; padding:18px 20px; } .lede{ font-size:17px; } }
  .video{ position:relative; cursor:pointer; }
  .video video::-webkit-media-controls{ display:none !important; }
  .grande{ position:absolute; left:50%; top:50%; width:92px; height:92px; margin:-46px 0 0 -46px; border:0; border-radius:50%; background:rgba(240,168,190,.95); color:#2a0a13; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 12px 34px rgba(0,0,0,.45); transition:transform .15s, opacity .2s; }
  .grande svg{ width:44px; height:44px; margin-left:5px; }
  .grande:hover{ transform:scale(1.06); }
  .pp{ position:absolute; left:14px; bottom:14px; width:46px; height:46px; border:0; border-radius:50%; background:rgba(26,5,9,.72); color:#fff; display:none; align-items:center; justify-content:center; cursor:pointer; backdrop-filter:blur(6px); }
  .pp svg{ width:22px; height:22px; } .pp .ic-play{ display:none; margin-left:2px; }
  .video.jugando .grande{ opacity:0; pointer-events:none; } .video.jugando .pp, .video.pausado .pp{ display:flex; }
  .video.pausado .pp .ic-pause{ display:none; } .video.pausado .pp .ic-play{ display:block; }
  .video.pausado .grande{ opacity:1; pointer-events:auto; }
  /* Al terminar el video, el botón se mueve para invitar a tocarlo */
  @keyframes llama{ 0%,100%{ transform:translateY(0) scale(1); box-shadow:0 14px 34px rgba(232,138,168,.32); } 12%{ transform:translateY(-9px) scale(1.04); box-shadow:0 22px 44px rgba(232,138,168,.6); } 24%{ transform:translateY(0) scale(1); } 34%{ transform:translateX(-5px); } 44%{ transform:translateX(5px); } 54%{ transform:translateX(-4px); } 64%{ transform:translateX(3px); } 74%{ transform:translateX(0); } }
  @keyframes brillo{ 0%,100%{ box-shadow:0 0 0 0 rgba(240,168,190,.65), 0 14px 34px rgba(232,138,168,.32); } 50%{ box-shadow:0 0 0 16px rgba(240,168,190,0), 0 14px 34px rgba(232,138,168,.5); } }
  .btn.llama{ animation:llama 2.2s ease-in-out infinite, brillo 1.4s ease-out infinite; }
  @media (prefers-reduced-motion:reduce){ .btn.llama{ animation:brillo 1.6s ease-out infinite; } }

<body>
<div class="wrap">
  <header><img src="https://shu.stepherup.com/assets/logo-sitio.png" alt="Step Her Up" width="112" height="64"></header>
  <h1>¡Felicidades! Ya reservaste <em>tu lugar</em></h1>

  <div class="video" id="caja">
    <video playsinline preload="metadata" poster="https://shu.stepherup.com/assets/typ-clase-poster.jpg" id="v" disablepictureinpicture controlslist="nodownload noplaybackrate nofullscreen noremoteplayback">
      <source src="https://shu.stepherup.com/assets/typ-clase.mp4" type="video/mp4">
      Tu navegador no puede reproducir este video.
    </video>
    <button type="button" class="grande" id="grande" aria-label="Reproducir el video"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 001.5.86l10.5-6.5a1 1 0 000-1.72L9.5 4.64A1 1 0 008 5.5z"/></svg></button>
    <button type="button" class="pp" id="pp" aria-label="Pausar"><svg class="ic-pause" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4h3.5v16H7zM13.5 4H17v16h-3.5z"/></svg><svg class="ic-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 001.5.86l10.5-6.5a1 1 0 000-1.72L9.5 4.64A1 1 0 008 5.5z"/></svg></button>
  </div>

  <p class="lede lede-abajo">Falta un último paso y es muy rápido. Entra al grupo de WhatsApp: ahí te mandamos los recordatorios y el enlace para entrar a la clase.</p>
  <a class="btn wa" href="https://chat.whatsapp.com/L0Mjb4eIL52FT966cokUxt?mode=gi_t" data-pos="abajo">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 004.74 1.21c5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2zm5.8 14.17c-.25.7-1.45 1.34-2 1.4-.51.06-1.15.09-1.86-.12-.43-.14-.98-.32-1.69-.63-2.98-1.29-4.93-4.3-5.08-4.5-.15-.2-1.21-1.61-1.21-3.07 0-1.46.77-2.18 1.04-2.48.27-.3.59-.37.79-.37h.57c.18 0 .43-.07.67.51.25.6.84 2.06.92 2.21.07.15.12.32.02.52-.1.2-.15.32-.3.5-.15.17-.31.39-.45.52-.15.15-.3.31-.13.6.17.3.77 1.27 1.65 2.05 1.13 1.01 2.09 1.32 2.39 1.47.3.15.47.12.65-.07.17-.2.75-.87.95-1.17.2-.3.4-.25.67-.15.27.1 1.73.82 2.03.97.3.15.5.22.57.35.07.12.07.72-.18 1.42z"/></svg>
    Entrar al grupo de WhatsApp
  </a>
  <div style="height:56px"></div>
</div>
<script>
  // Meta Pixel: clic en el botón del grupo (evento propio) y reproducción del video
  document.querySelectorAll("a.wa").forEach(function (a) {
    a.addEventListener("click", function () {
      try { if (typeof fbq === "function") fbq("trackCustom", "ClicGrupoWhatsApp", { posicion: a.getAttribute("data-pos") }); } catch (e) {}
    });
  });
  (function () {
    var v = document.getElementById("v"), caja = document.getElementById("caja"), grande = document.getElementById("grande"), pp = document.getElementById("pp");
    var btn = document.querySelector("a.wa"), enviado = false;
    v.muted = false; v.volume = 1;
    function alternar() { if (v.paused) { v.muted = false; v.play(); } else { v.pause(); } }
    caja.addEventListener("click", function (e) { if (e.target.closest("button") && e.target.closest("button") !== grande && e.target.closest("button") !== pp) return; alternar(); });
    v.addEventListener("play", function () {
      btn.classList.remove("llama"); caja.classList.add("jugando"); caja.classList.remove("pausado");
      if (enviado) return; enviado = true;
      try { if (typeof fbq === "function") fbq("trackCustom", "VerVideoGracias"); } catch (e) {}
    });
    v.addEventListener("pause", function () { if (!v.ended) { caja.classList.add("pausado"); caja.classList.remove("jugando"); } });
    v.addEventListener("volumechange", function () { if (v.muted || v.volume < 1) { v.muted = false; v.volume = 1; } });
    v.addEventListener("ended", function () {
      caja.classList.remove("jugando"); caja.classList.add("pausado"); pp.setAttribute("aria-label", "Ver de nuevo");
      btn.classList.add("llama");
      try { btn.scrollIntoView({ behavior: "smooth", block: "center" }); } catch (e) {}
      try { if (typeof fbq === "function") fbq("trackCustom", "VideoGraciasTerminado"); } catch (e) {}
    });
    btn.addEventListener("click", function () { btn.classList.remove("llama"); });
  })();
</script>
